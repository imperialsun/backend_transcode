services:
  backend:
    image: golang:1.25.9
    working_dir: /workspace
    command: ["bash", "./scripts/run-local-backend.sh"]
    ports:
      - "8080:8080"
    environment:
      APP_ENV: "development"
      PORT: "8080"
      SQLITE_PATH: "/data/backend.sqlite"
      JWT_SECRET: "${JWT_SECRET:-dev-insecure-jwt-secret-change-me}"
      ACCESS_TTL_MINUTES: "${ACCESS_TTL_MINUTES:-15}"
      REFRESH_TTL_HOURS: "${REFRESH_TTL_HOURS:-720}"
      ADMIN_ACCESS_TTL_MINUTES: "${ADMIN_ACCESS_TTL_MINUTES:-10}"
      ADMIN_REFRESH_TTL_HOURS: "${ADMIN_REFRESH_TTL_HOURS:-12}"
      COOKIE_SECURE: "false"
      APP_CORS_ORIGINS: "${APP_CORS_ORIGINS:-http://localhost:3000,http://localhost:4173}"
      ADMIN_CORS_ORIGINS: "${ADMIN_CORS_ORIGINS:-http://localhost:4173}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:4173}"
      MISTRAL_API_BASE_URL: "${MISTRAL_API_BASE_URL:-https://api.mistral.ai}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://localhost:3000}"
      ADMIN_PUBLIC_URL: "${ADMIN_PUBLIC_URL:-http://localhost:4173}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-admin@demeter.local}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}"
      BOOTSTRAP_ORG_NAME: "${BOOTSTRAP_ORG_NAME:-Demeter Sante}"
      GOMODCACHE: "/go/pkg/mod"
      GOCACHE: "/root/.cache/go-build"
    volumes:
      - .:/workspace
      - backend-data-dev:/data
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

volumes:
  backend-data-dev:
  go-mod-cache:
  go-build-cache:
