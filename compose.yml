services:
  backend:
    image: transcode-backend:local
    build:
      context: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      APP_ENV: "production"
      PORT: "8080"
      SQLITE_PATH: "/data/backend.sqlite"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      ACCESS_TTL_MINUTES: "${ACCESS_TTL_MINUTES:-15}"
      REFRESH_TTL_HOURS: "${REFRESH_TTL_HOURS:-720}"
      ADMIN_ACCESS_TTL_MINUTES: "${ADMIN_ACCESS_TTL_MINUTES:-10}"
      ADMIN_REFRESH_TTL_HOURS: "${ADMIN_REFRESH_TTL_HOURS:-12}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      APP_CORS_ORIGINS: "${APP_CORS_ORIGINS:?set APP_CORS_ORIGINS to HTTPS origin(s)}"
      ADMIN_CORS_ORIGINS: "${ADMIN_CORS_ORIGINS:?set ADMIN_CORS_ORIGINS to HTTPS origin(s)}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:4173}"
      MISTRAL_API_BASE_URL: "${MISTRAL_API_BASE_URL:-https://api.mistral.ai}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://localhost:3000}"
      ADMIN_PUBLIC_URL: "${ADMIN_PUBLIC_URL:-http://localhost:4173}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      BOOTSTRAP_ORG_NAME: "${BOOTSTRAP_ORG_NAME:-Default Organization}"
    volumes:
      - backend-data:/data

volumes:
  backend-data:
